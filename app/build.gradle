plugins {
    id "com.android.application"
}

android {
    namespace "com.waad.ideaboard"
    compileSdk 34

    defaultConfig {
        applicationId "com.waad.ideaboard"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // unsigned release; CI publishes the debug APK for sideloading
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
